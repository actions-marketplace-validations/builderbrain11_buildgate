<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuildGate — The Trust Layer for AI Software (powered by legit.run)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#080B0F] text-slate-100 font-sans antialiased selection:bg-indigo-500/30 selection:text-indigo-200 min-h-screen relative overflow-x-hidden">
    <!-- Ambient Bioluminescent Mesh Glow Orbs -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
      <!-- Violet Orb -->
      <div class="absolute -top-32 -left-32 w-[600px] h-[600px] rounded-full bg-gradient-to-tr from-purple-900/20 via-indigo-900/15 to-transparent blur-[120px] ambient-orb-1"></div>
      <!-- Cyan Orb -->
      <div class="absolute top-1/4 -right-40 w-[700px] h-[700px] rounded-full bg-gradient-to-bl from-sky-600/15 via-cyan-900/10 to-transparent blur-[140px] ambient-orb-2"></div>
      <!-- Emerald Vitality Orb -->
      <div class="absolute -bottom-40 left-1/3 w-[650px] h-[650px] rounded-full bg-gradient-to-t from-emerald-950/15 via-teal-900/10 to-transparent blur-[130px] ambient-orb-3"></div>
      <!-- Fine Digital Grid Mesh Overlay -->
      <div class="absolute inset-0 bg-[linear-gradient(to_right,#ffffff04_1px,transparent_1px),linear-gradient(to_bottom,#ffffff04_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_0%,#000_70%,transparent_100%)]"></div>
    </div>

    <div id="root" class="relative z-10"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
